<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="cross-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <!-- Latin Cross -->
      <path d="M20 6 v28 M12 14 h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
      <!-- Small decorative diamond -->
      <polygon points="20,2 22,4 20,6 18,4" fill="currentColor" opacity="0.4"/>
      <!-- Trefoil / Fleur accent -->
      <circle cx="20" cy="36" r="1.5" fill="currentColor" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#cross-grid)"/>
</svg>